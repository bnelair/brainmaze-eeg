[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-eeg"
version = "2.0.0"
description = "BrainMaze: Brain Electrophysiology, Behavior and Dynamics Analysis Toolbox"
authors = [
    { name = "Filip Mivalt", email = "mivalt.filip@mayo.edu" }
]
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
dependencies = [
    "setuptools>=61",
    # brainmaze_utils >= 3.0.0 (utils PR #28) resamples correctly at every input rate and
    # DC level; 2.0.0 corrupts some rates (the classifiers then raise ValueError).
    "brainmaze_utils>=3.0.0",
    "numpy>=1.20.0",
    "pandas>=2.2.0",
    "pytz",
    "python-dateutil",
    "scikit-learn>=1.6.1",
    "scipy",
    "tqdm",
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
urls = { "Homepage" = "https://github.com/bnelair/brainmaze-eeg" }

[project.optional-dependencies]
test = [
    "pytest",
]
docs = [
    "sphinx>=8.0.0,<9.0.0",
    "sphinx_book_theme>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
# Ship only the package itself. Everything else (demo/, docs_src/, img/ and the in-package
# test suite brainmaze_eeg/tests with its .npz fixtures) must never reach the wheel; without
# `include`, setuptools' namespace discovery turned demo/ and docs_src/ into top-level packages.
include = ["brainmaze_eeg", "brainmaze_eeg.*"]
exclude = ["brainmaze_eeg.tests", "brainmaze_eeg.tests.*"]

[tool.setuptools]
# No package data: brainmaze_eeg needs no non-Python files at runtime. The sdist is
# trimmed the same way by MANIFEST.in.
include-package-data = false
