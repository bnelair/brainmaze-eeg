[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-eeg"
version = "3.0.0"
description = "BrainMaze: Brain Electrophysiology, Behavior and Dynamics Analysis Toolbox"
authors = [
    { name = "Filip Mivalt", email = "mivalt.filip@mayo.edu" }
]
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
dependencies = [
    # brainmaze_utils >= 3.0.0 (utils PR #28) resamples correctly at every input rate and
    # DC level; 2.0.0 corrupts some rates (the classifiers then raise ValueError).
    "brainmaze_utils>=3.0.0",
    # Lower bounds = the lowest versions the full test suite has been run against
    # (uv --resolution lowest-direct, Python 3.10: numpy 1.24.0, scipy 1.10.0,
    # pandas 2.2.0, scikit-learn 1.6.1). numpy/scipy match brainmaze_utils 3.0.0's own
    # floors; the old "numpy>=1.20.0" and unbounded scipy were never installable together
    # with brainmaze_utils/pandas 2.2 and were not tested.
    "numpy>=1.24",
    "pandas>=2.2.0",
    "pytz",
    "python-dateutil",
    "scikit-learn>=1.6.1",
    "scipy>=1.10",
    "tqdm",
]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
urls = { "Homepage" = "https://github.com/bnelair/brainmaze-eeg" }

[project.optional-dependencies]
# Plotting in brainmaze_eeg.hypnogram (plot_hypnogram, score_night(plot=True)).
plot = [
    "matplotlib>=3.7",
]
test = [
    # >= 8.2: older pytest in --import-mode=importlib (used by the family compatibility
    # workflow) cannot import the shared helper brainmaze_eeg.tests.spike_synth.
    "pytest>=8.2",
    # so that CI runs the plotting tests (Agg backend) instead of skipping them
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=8.0.0,<9.0.0",
    "sphinx_book_theme>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
# Ship only the package itself. Everything else (demo/, docs_src/, img/ and the in-package
# test suite brainmaze_eeg/tests with its .npz fixtures) must never reach the wheel; without
# `include`, setuptools' namespace discovery turned demo/ and docs_src/ into top-level packages.
include = ["brainmaze_eeg", "brainmaze_eeg.*"]
exclude = ["brainmaze_eeg.tests", "brainmaze_eeg.tests.*"]

[tool.setuptools]
# No package data: brainmaze_eeg needs no non-Python files at runtime (the shared artifact
# check allows only .py/.pyi/py.typed inside the package). If a runtime data file is ever
# added, list it under [tool.setuptools.package-data] AND in `required-assets` in
# .github/workflows/ci.yml + release.yml; otherwise it silently drops out of the wheel
# while the tests (which import from the source tree) still pass.
include-package-data = false
